services:
  # ==================== BACKEND INFRA & APP ====================
  ollama:
    image: ollama/ollama:0.33.2
    container_name: ollama_container
    restart: always
    ports:
      - "11434:11434"
    volumes:
      - ollama_storage:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks:
      - hiring_network

  qdrant:
    image: qdrant/qdrant:v1.12.0
    container_name: qdrant_container
    restart: unless-stopped
    ports:
      - "6334:6334"   #-- Dashboad
      - "6333:6333"   #-- API
    volumes:
      - qdrant_storage:/qdrant/storage
      - ./backend/src/Infrastructure/docker/qdrant_init:/qdrant_init_data:ro
    networks:
      - hiring_network


  backend:
    build:
      context: ./backend
      dockerfile: src/Infrastructure/docker/Dockerfile
    container_name: symfony_php
    restart: unless-stopped
    volumes: 
      - ./backend:/var/www/html
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=mysql://root:mdp@mariadb:3306/ats_recruitment?charset=utf8mb4
      - QDRANT_URL=http://qdrant:6333
      - OLLAMA_ROOT_URL=http://ollama:11434
    depends_on:
      - mariadb
      - qdrant
    networks:
      - hiring_network


  nginx:
    image: nginx:alpine
    container_name: symfony_nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./backend:/var/www/html
      - ./backend/src/Infrastructure/docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend
    networks:
      - hiring_network


  mariadb: 
    image: mariadb:10.11.6
    container_name: symfony_mariadb
    restart: unless-stopped
    volumes:
      - ./backend/src/Infrastructure/docker/db/init:/docker-entrypoint-initdb.d
      - mariadb_data:/var/lib/mysql
    env_file:
      - ./backend/.env
    environment:
      - MYSQL_ROOT_PASSWORD=mdp
      - MYSQL_DATABASE=ats_recruitment
    networks:
      - hiring_network

  # ==================== FRONTEND ====================
  frontend:
    build:
      context: ./frontend
      dockerfile: docker/Dockerfile 
    container_name: vite_frontend
    restart: unless-stopped
    ports:
      - "5174:5174"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - nginx
    environment:
      - name=value


volumes:
  ollama_storage:
  qdrant_storage:
  mariadb_data:

networks:
  hiring_network:
    driver: bridge