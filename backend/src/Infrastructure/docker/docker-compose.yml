services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama_container
    restart: always
    ports:
      - "11434:11434"
    volumes:
      - ollama_storage:/root/.ollama
    

    # Configuration  GPU NVIDIA
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
  

  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant_container
    restart: unless-stopped
    ports:
      - "6333:6333" #-- Api/Dashboard
      - "6334:6334" #-- Api gRPC
    
    volumes:
      - qdrant_storage:/qdrant/storage


volumes:
  ollama_storage:
  qdrant_storage: