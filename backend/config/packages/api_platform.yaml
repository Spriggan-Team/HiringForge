api_platform:
    title: API Platform
    version: 1.0.0
    formats:
        json:   ['application/json']
    patch_formats:
        json:   ['application/json']
    mapping:
            paths: 
                - '%kernel.project_dir%/src/Infrastructure/Persistence/Doctrine/ORM'
    defaults:
        stateless: true
        cache_headers:
            vary: ['Content-Type', 'Authorization', 'Origin']
